<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Page not found &bull; The Halite &amp; Ember Foundation</title>
<meta name="robots" content="noindex">

<link rel="preload" href="/fonts/source-serif-4-subset.woff2" as="font" type="font/woff2" crossorigin>

<style>
@font-face {
  font-family: "Source Serif 4";
  src: url("/fonts/source-serif-4-subset.woff2") format("woff2-variations");
  font-weight: 300 600;
  font-style: normal;
  font-display: swap;
}

/* Metrics matched to Source Serif 4 so the swap costs no reflow. */
@font-face {
  font-family: "Serif Fallback Georgia";
  src: local("Georgia");
  size-adjust: 98.66%;
  ascent-override: 105.01%;
  descent-override: 33.95%;
  line-gap-override: 0%;
}
@font-face {
  font-family: "Serif Fallback Times";
  src: local("Times New Roman");
  size-adjust: 106.2%;
  ascent-override: 97.55%;
  descent-override: 31.54%;
  line-gap-override: 0%;
}

:root {
  color-scheme: light dark;

  --serif: "Source Serif 4", "Serif Fallback Georgia", "Serif Fallback Times", Georgia, serif;

  --ground: #faf7f1;
  --ink: #221e19;
  --muted: #5c544a;
  --accent: #9c3d1f;
  --selection: #f0e2d3;

  --step-body: clamp(1.0625rem, 1rem + 0.3vw, 1.1875rem);
  --step-message: clamp(1.5rem, 1.2rem + 1.4vw, 2.25rem);

  --space-2: 0.5rem;
  --space-5: 2rem;
  --space-6: 3rem;
}

@media (prefers-color-scheme: dark) {
  :root {
    --ground: #17140f;
    --ink: #f4efe5;
    --muted: #a69c8d;
    --accent: #e39068;
    --selection: #3a2f24;
  }
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--serif);
  font-size: var(--step-body);
  line-height: 1.62;
  font-kerning: normal;
}

::selection { background: var(--selection); }

.page {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  padding: var(--space-6) clamp(1.5rem, 6vw, 6rem);
}
@supports (min-height: 100svh) {
  .page { min-height: 100svh; }
}

main {
  margin-block: auto;
  padding-block: var(--space-6);
}

.nameplate {
  margin: 0;
  font-size: 0.8125rem;
  font-weight: 500;
  line-height: 1.4;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.message {
  max-width: 30ch;
  margin: var(--space-6) 0 0;
  font-size: var(--step-message);
  font-weight: 350;
  line-height: 1.2;
  letter-spacing: -0.011em;
  text-wrap: balance;
}

.back { margin: var(--space-5) 0 0; }

a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.18em;
  transition: color 160ms ease;
}

a:hover { color: var(--ink); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 4px;
  border-radius: 1px;
}

footer {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2) var(--space-5);
  justify-content: space-between;
  max-width: 36rem;
  font-size: 0.9375rem;
  color: var(--muted);
}

footer p { margin: 0; }

.year { font-variant-numeric: oldstyle-nums; }

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 0.01ms !important; }
}
</style>
</head>

<body>
<div class="page">
  <main>
    <p class="nameplate">The Halite&nbsp;&amp;&nbsp;Ember Foundation</p>

    <h1 class="message">That page cannot be found.</h1>

    <p class="back"><a href="/">Return to the home page</a></p>
  </main>

  <footer>
    <p>The Halite &amp; Ember Foundation</p>
    <p class="year">2026</p>
  </footer>
</div>
</body>
</html>
